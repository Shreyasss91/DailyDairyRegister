[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-dairy-register"
version = "0.1.0"
description = "Local-first Daily Dairy Register and O&M scheduling application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[project.scripts]
dailyworkreg = "dailyworkreg.interfaces.server:main"

[tool.setuptools.packages.find]
include = ["dailyworkreg*"]

[tool.setuptools.package-data]
"dailyworkreg.interfaces" = [
    "templates/*.html",
    "static/*.js",
    "static/*.css",
]
